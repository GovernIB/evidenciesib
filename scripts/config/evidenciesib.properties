#-----------------------------------------
# Configuració de la Capçalera del FRONT
# ----------------------------------------

# Opcional. Valor per defecte false. Nou a la versió 1.0.5. En les pantalles de 
# firma del front posa una capçalera si aquesta propietat val true.
es.caib.evidenciesib.front.signatureheader.enabled=false

# Opcional. Nou a la versió 1.0.5. Valor per defecte és el color del back. 
# En cas que aquesta propietat tampoc estigui definida llavors 
# s’utilitzarà #2E8B57. En la pantalla de selecció del mòdul de firma posa una
# capçalera amb color de fons definit per aquesta propietat. Només es mostrarà
# la capçalera si la propietat es.caib.evidenciesib.front.signatureheader.enabled val true
es.caib.evidenciesib.front.signatureheader.backgroundcolor=#FF0000

# Opcional. Nou a la versió 1.0.5. Valor per defecte el logo de la capçalera del back.
# En la pantalla de selecció del mòdul de firma posa una capçalera amb un logo
# definit per aquesta propietat. Només es mostrarà la capçalera si la propietat
# es.caib.evidenciesib.front.signatureheader.enabled val true
es.caib.evidenciesib.front.signatureheader.logourl=http://anadal:8080/portafibback/common/arxiu/GH9NHmWp8uCwY0UbhAy48Q==?nom=fundaciobit-logo-peu.png&mime=image%2Fpng
        
# Opcional. Nou a la versió 1.0.5. Per defecte és el nom de l´entitat. En la pantalla de
# selecció del mòdul de firma posa una capçalera amb un text definit per aquesta
# propietat. Si no està definida, el valor per defecte és selecciona «EvidènciesIB».
# Si val "-" llavors significa que no es vol mostrar cap text. Només es mostrarà
# la capçalera si la propietat es.caib.evidenciesib.front.signatureheader.enabled val true
es.caib.evidenciesib.front.signatureheader.text=MY ENTITY